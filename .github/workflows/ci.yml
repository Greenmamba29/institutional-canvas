name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The root tsconfig.json has "files": [] and only references the project
      # configs, so `tsc --noEmit` on it checks nothing. Check each project.
      - name: TypeScript type checking (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: TypeScript type checking (tooling)
        run: npx tsc --noEmit -p tsconfig.node.json

      # Errors fail the build; warnings are reported but allowed for now.
      - name: ESLint
        run: npx eslint .

      - name: RPC violations check
        run: |
          chmod +x scripts/check-rpc-violations.sh
          ./scripts/check-rpc-violations.sh

      # Includes the src/policy and src/skills suites.
      - name: Run tests
        run: npm test -- --run --reporter=verbose

      - name: Build verification
        run: npm run build

  edge-functions:
    name: Edge Function Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Shared security helper tests
        run: deno test --allow-env supabase/functions/_shared/security.test.ts

      # Catches syntax errors and undefined identifiers without fetching remote imports.
      - name: Lint edge functions
        run: deno lint --rules-include=no-undef --rules-exclude=no-import-prefix,no-unused-vars,no-explicit-any,require-await,no-empty,prefer-const,no-inferrable-types,ban-types,no-unversioned-import supabase/functions

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocks on critical advisories in production dependencies.
      - name: Security audit (blocking, critical)
        run: npm audit --omit=dev --audit-level=critical

      # Remaining high advisories (vite 5, zod 3) need major-version upgrades;
      # reported here until those upgrades land.
      - name: Security audit (report, high)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
