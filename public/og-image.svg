<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D16C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AA8C2C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo Circle -->
  <circle cx="200" cy="315" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">Li</text>
  
  <!-- Company Name -->
  <text x="340" y="270" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">LithiumBuy</text>
  
  <!-- Tagline -->
  <text x="340" y="350" font-family="Arial, sans-serif" font-size="28" fill="#D4AF37">#1 Global Lithium &amp; Recycling Marketplace</text>
  
  <!-- Features -->
  <text x="340" y="420" font-family="Arial, sans-serif" font-size="20" fill="#888888">✓ Primary Lithium Supply  •  ✓ Advanced Lithium Recycling  •  ✓ Circular Economy  •  ✓ Verified Global Scale</text>
  
  <!-- Bottom URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="24" fill="#D4AF37" text-anchor="middle">lithiumbuy.com</text>
  
  <!-- Decorative Elements -->
  <circle cx="1100" cy="100" r="4" fill="#D4AF37" opacity="0.6"/>
  <circle cx="1050" cy="150" r="3" fill="#D4AF37" opacity="0.4"/>
  <circle cx="1120" cy="180" r="2" fill="#D4AF37" opacity="0.3"/>
  <circle cx="100" cy="550" r="4" fill="#D4AF37" opacity="0.6"/>
  <circle cx="150" cy="520" r="3" fill="#D4AF37" opacity="0.4"/>
</svg>
